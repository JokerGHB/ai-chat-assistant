spring.application.name=end
server.port=${SERVER_PORT:8080}

# ---- 数据源：本地 MySQL，可用环境变量覆盖 ----
# Override DB_URL, DB_USERNAME and DB_PASSWORD in the local environment as needed.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/ai_chat_local?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- MyBatis：下划线列名自动映射为驼峰字段 ----
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL

spring.jackson.time-zone=Asia/Taipei

# ---- DeepSeek 大模型（固定模型，不做切换；密钥只从环境变量读取）----
# DeepSeek Chat Completions. Set DEEPSEEK_API_KEY in the IDEA Run Configuration.
deepseek.api-key=${DEEPSEEK_API_KEY:}
deepseek.base-url=https://api.deepseek.com
deepseek.model=deepseek-flash
# token 单价（元/千 token），用于统计看板成本；按实际定价调整
deepseek.prompt-price-per-1k=${DEEPSEEK_PROMPT_PRICE:0.001}
deepseek.completion-price-per-1k=${DEEPSEEK_COMPLETION_PRICE:0.002}

# ---- 认证与登录状态 ----
# 登录令牌闲置超时（分钟），超时自动失效强制重新登录
auth.token-idle-minutes=30
# 初始管理员密码（仅在启动检测到无 admin 账号时创建使用，首次登录后请修改）
auth.admin-initial-password=${ADMIN_INITIAL_PASSWORD:Admin@123}

# ---- 聊天业务限制 ----
# 单用户每日对话次数上限
chat.daily-limit=${CHAT_DAILY_LIMIT:100}
# 会话标题自动生成时截取的首条提问长度
chat.title-max-length=24
# 敏感词列表（英文逗号分隔，启动时加载进内存；命中则拦截，不提交大模型）
chat.sensitive-words=${CHAT_SENSITIVE_WORDS:}
